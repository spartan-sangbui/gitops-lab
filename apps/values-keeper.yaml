# App phụ luôn tồn tại: không để thư mục apps/ rỗng khi xoá values-demo.yaml (xem phần Lỗi).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: keeper-web-local
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: keeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://spartan-stratos.github.io/helm-charts
    chart: spartan
    targetRevision: 0.11.0
    helm:
      releaseName: keeper
      valuesObject:
        replicaCount: 1
        image:
          repository: nginx
          pullPolicy: IfNotPresent
          tag: "1.27"
        containerPort: 80
        fullnameOverride: keeper
        containerName: keeper
        appNameLabel: keeper
